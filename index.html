<!doctype html><html lang="de-CH"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#125f52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Passé composé"><link rel="manifest" href="manifest.webmanifest"><title>Passé composé Trainer</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1b2930;background:#f5f8f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:17px;padding-bottom:90px}header{background:#125f52;color:white;padding:22px;border-radius:0 0 23px 23px}header h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}h2{font-size:21px}h3{font-size:18px;color:#125f52}.panel{background:white;padding:19px;border:1px solid #e1e9e5;border-radius:17px;margin:13px 0;box-shadow:0 2px 9px #1231  }button{font:inherit;border:0;border-radius:11px;padding:12px 16px;cursor:pointer;background:#e7f1eb;color:#125f52;font-weight:700;margin:4px 4px 4px 0}button.primary{color:white;background:#125f52}button:disabled{opacity:.55}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:12px;background:#ebf1ef;padding:4px 9px;border-radius:20px}.ex{background:#f0f7f2;border-left:4px solid #1c8064;padding:12px;border-radius:8px;margin:10px 0}.muted{color:#667775;font-size:14px}.question{font-size:19px;font-weight:700;line-height:1.5}.answers{display:grid;gap:7px}.answers button{text-align:left;margin:0;background:#f0f4f2;border:1px solid #d9e2de}.answers button.selected{outline:2px solid #125f52}input{width:100%;font-size:18px;padding:14px;border-radius:11px;border:1px solid #bbcfc5;margin:8px 0}.feedback{border-radius:12px;padding:13px;margin:12px 0}.good{background:#dff5e6;color:#146238}.bad{background:#fff0e4;color:#8a3f1a}nav{position:fixed;bottom:0;background:white;left:0;right:0;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom)}nav button{padding:8px;font-size:13px;background:transparent}.progress{height:9px;background:#dce9e3;border-radius:12px;overflow:hidden}.progress span{height:100%;display:block;background:#138362}code{white-space:normal}.hide{display:none}</style></head><body><header><h1>🇫🇷 Passé composé</h1><p>Theorie · Beispiele · Üben · Direktes Feedback</p></header><div class="wrap" id="app"></div><nav><button onclick="home()">🏠 Themen</button><button onclick="mixed()">🎯 Mix</button><button onclick="stats()">📈 Fortschritt</button></nav><script>
const lessons=[
{title:"29 · Bildung mit avoir",short:"Hilfsverb + Partizip",theory:"Das passé composé besteht aus dem Präsens von avoir und dem participe passé. Bei avoir bleibt das Partizip normalerweise unverändert.",examples:["J’ai mangé. – Ich habe gegessen.","Nous avons téléphoné. – Wir haben telefoniert.","Ils ont fini. – Sie haben beendet."],words:[["manger","mangé"],["parler","parlé"],["finir","fini"],["vendre","vendu"],["dormir","dormi"]]},
{title:"29 · Bildung mit être",short:"Bewegung und Angleichung",theory:"Einige Verben bilden das passé composé mit être. Bei être passt sich das Partizip dem Subjekt an: weiblich +e, Mehrzahl +s, weibliche Mehrzahl +es.",examples:["Elle est allée au cinéma.","Ils sont restés à la maison.","Léa et Marie sont sorties."],words:[["aller","allé"],["rester","resté"],["partir","parti"],["sortir","sorti"],["arriver","arrivé"]]},
{title:"29 · Verneinung",short:"ne … pas um das Hilfsverb",theory:"Die Verneinung umschliesst das konjugierte Hilfsverb, nicht das Partizip. Bei reflexiven Verben steht ne vor dem Reflexivpronomen.",examples:["Je n’ai pas dormi.","Elle n’est pas restée.","Je ne me suis pas reposé(e)."],words:[["ne / pas / j’ai / mangé","Je n’ai pas mangé"],["ne / pas / elle est / partie","Elle n’est pas partie"]]},
{title:"30 · Regelmässige Partizipien",short:"-er → -é, -ir → -i, -re → -u",theory:"Regelmässige Verben bilden das Partizip meist so: -er → -é, -ir → -i, -re → -u. Achte auf den Akzent.",examples:["jouer → joué","finir → fini","attendre → attendu"],words:[["jouer","joué"],["réfléchir","réfléchi"],["attendre","attendu"],["répondre","répondu"],["téléphoner","téléphoné"],["vendre","vendu"]]},
{title:"30 · Unregelmässige Partizipien",short:"Die wichtigen Formen lernen",theory:"Häufige Verben haben ein unregelmässiges Partizip. Diese Formen lernst du am besten durch wiederholtes Üben.",examples:["avoir → eu; être → été; faire → fait","prendre → pris; mettre → mis; écrire → écrit","boire → bu; lire → lu; voir → vu"],words:[["avoir","eu"],["être","été"],["dire","dit"],["écrire","écrit"],["faire","fait"],["mettre","mis"],["prendre","pris"],["boire","bu"],["croire","cru"],["lire","lu"],["plaire","plu"],["recevoir","reçu"],["venir","venu"],["voir","vu"],["devoir","dû"],["pouvoir","pu"],["vouloir","voulu"],["savoir","su"]]},
{title:"30 · Objekt und Partizip",short:"Stellung und Angleichung",theory:"Bei avoir wird das Partizip normalerweise nicht angeglichen. Steht das direkte Objekt jedoch vor dem Verb, stimmt das Partizip mit diesem Objekt überein.",examples:["Elle a acheté des fleurs.","Quelles fleurs avez-vous achetées ?","Je les ai rencontrés hier."],words:[["Elle a acheté des fleurs.","Elle a acheté des fleurs."],["Quelles fleurs avez-vous achetées ?","Quelles fleurs avez-vous achetées ?"]]},
{title:"31 · avoir oder être?",short:"Hilfsverb wählen",theory:"Die meisten Verben verwenden avoir – auch marcher, courir, sauter, nager und sogar être. Eine kleine Gruppe von Orts- und Zustandswechselverben nimmt être.",examples:["Nous avons marché six heures.","Elle a été malade.","Je suis arrivé(e). Nous sommes partis."],words:[["marcher","avoir"],["courir","avoir"],["être","avoir"],["aller","être"],["venir","être"],["partir","être"],["arriver","être"],["rester","être"],["tomber","être"],["nager","avoir"],["sortir","être"],["mourir","être"]]},
{title:"31 · Reflexive Verben",short:"se reposer → je me suis reposé(e)",theory:"Alle reflexiven Verben bilden das passé composé mit être. Das Reflexivpronomen bleibt vor dem Hilfsverb. Normalerweise passt sich das Partizip dem Subjekt an; bei einigen reflexiven Konstruktionen gelten Ausnahmen.",examples:["Je me suis reposé(e).","Nous nous sommes levés.","Elle ne s’est pas reposée."],words:[["je / se reposer","Je me suis reposé"],["elle / se reposer","Elle s’est reposée"],["nous / se lever","Nous nous sommes levés"]]}];
const pron=[["je","ai","suis"],["tu","as","es"],["il","a","est"],["elle","a","est"],["nous","avons","sommes"],["vous","avez","êtes"],["ils","ont","sont"],["elles","ont","sont"]];
const norm=s=>s.toLowerCase().normalize("NFC").replace(/[’']/g,"'").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
let questions=[],index=0,answered=false,lesson=-1,chosen=null;
const app=document.getElementById("app"),saved=JSON.parse(localStorage.getItem("pcScores")||"{}");
function home(){app.innerHTML='<h2>Wähle ein Thema</h2><p class="muted">Kapitel 29–31 · Jede Lektion enthält Erklärungen und interaktive Übungen.</p>'+lessons.map((l,i)=>'<section class="panel"><h3>'+l.title+'</h3><p>'+l.short+'</p><span class="muted">'+(saved[i]?.right||0)+' von '+(saved[i]?.total||0)+' bisherigen Antworten richtig</span><p><button onclick="openLesson('+i+')">Theorie und Übungen →</button></p></section>').join('')}
function openLesson(i){lesson=i;let l=lessons[i];app.innerHTML='<button onclick="home()">← Zurück</button><h2>'+l.title+'</h2><section class="panel"><h3>So funktioniert es</h3><p>'+l.theory+'</p><h3>Beispiele</h3>'+l.examples.map(e=>'<div class="ex">'+e+'</div>').join('')+'</section><button class="primary" onclick="start('+i+')">Jetzt üben →</button>'}
function build(i){let l=lessons[i],q=[];l.words.forEach(([inf,p])=>{if(i===2||i===5||i===7){q.push({q:"Schreibe den französischen Satz korrekt: "+inf,a:p,why:l.theory});return}if(i===6){q.push({q:"Welches Hilfsverb verwendet «"+inf+"»?",a:p,choices:["avoir","être"],why:l.theory});return}q.push({q:"Wie lautet das participe passé von «"+inf+"»?",a:p,why:l.theory});if(i!==1){let pr=pron[q.length%pron.length];let start=pr[0]==="je"?"J'":pr[0].charAt(0).toUpperCase()+pr[0].slice(1)+" ";q.push({q:"Ergänze: "+start+"___ "+p+" (Verb: "+inf+")",a:pr[1],why:"Im passé composé mit avoir: "+pr[1]+" + "+p+"."})}else{let pr=pron[q.length%pron.length],form=pr[2],suffix=pr[0]==="elle"?"e":pr[0]==="ils"?"s":pr[0]==="elles"?"es":"";q.push({q:"Ergänze das Partizip: "+pr[0]+" "+form+" ____ (Verb: "+inf+")",a:p+suffix,why:l.theory})}});return q}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(i){lesson=i;questions=shuffle(build(i));index=0;showQuestion()}
function mixed(){lesson=-1;questions=shuffle(lessons.flatMap((l,i)=>build(i).map(q=>({...q,topic:i}))));index=0;showQuestion()}
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function showQuestion(){answered=false;chosen=null;let q=questions[index];if(!q){app.innerHTML='<section class="panel"><h2>Geschafft! 🎉</h2><button class="primary" onclick="home()">Zur Themenübersicht</button></section>';return}app.innerHTML='<button onclick="'+(lesson<0?'mixed()':'openLesson('+lesson+')')+'">← Zurück</button><p class="muted">Aufgabe '+(index+1)+' / '+questions.length+'</p><div class="progress"><span style="width:'+((index)/questions.length*100)+'%"></span></div><section class="panel"><p class="question">'+esc(q.q)+'</p>'+(q.choices?'<div class="answers">'+q.choices.map((c,j)=>'<button id="o'+j+'" onclick="choose('+j+')">'+esc(c)+'</button>').join('')+'</div>':'<input id="answer" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Deine Antwort" onkeydown="if(event.key===\'Enter\')check()">')+'<div id="feedback"></div><button id="check" class="primary" onclick="check()">Überprüfen</button><button id="next" style="display:none" class="primary" onclick="index++;showQuestion()">Weiter →</button></section>'}
function choose(j){if(answered)return;chosen=j;document.querySelectorAll('.answers button').forEach((b,k)=>b.classList.toggle('selected',k===j))}
function check(){if(answered)return;let q=questions[index],v=q.choices? q.choices[chosen]:(document.getElementById('answer')?.value||'');if(!v)return;answered=true;let ok=norm(v)===norm(q.a);document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'✓ Richtig!':'✗ Noch nicht richtig.')+'</strong><p>Richtige Lösung: <strong>'+esc(q.a)+'</strong></p><p>'+esc(q.why)+'</p></div>';document.getElementById('check').style.display='none';document.getElementById('next').style.display='inline-block';const s=lesson>=0?lesson:q.topic;saved[s] ||= {right:0,total:0};saved[s].total++;if(ok)saved[s].right++;localStorage.setItem("pcScores",JSON.stringify(saved))}
function stats(){app.innerHTML='<h2>Dein Lernfortschritt</h2>'+lessons.map((l,i)=>{let x=saved[i]||{right:0,total:0};return '<section class="panel"><strong>'+l.title+'</strong><p>'+x.right+' / '+x.total+' korrekt'+(x.total?' · '+Math.round(x.right/x.total*100)+' %':'')+'</p><div class="progress"><span style="width:'+(x.total?x.right/x.total*100:0)+'%"></span></div></section>'}).join('')+'<button onclick="if(confirm(\'Fortschritt wirklich löschen?\')){localStorage.removeItem(\'pcScores\');location.reload()}">Fortschritt zurücksetzen</button>'}
home();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
