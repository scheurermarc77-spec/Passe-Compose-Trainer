:#dc963e}.ch30 .num{background:#ffdfb5;color:#97570d}.ch30 h3,.ch30 .eyebrow{color:#9d631e}.ch31{background:#f4edff;border-color:#9665cb}.ch31 .num{background:#e6d9fc;color:#6939a8}.ch31 h3,.ch31 .eyebrow{color:#6939a8}.theory-panel{background:#eef6ff;border-color:#bad8ef}.theory-panel h3{color:#215e95}.theory-panel .ex{background:#fff;border-left-color:#4e9bdb}.question-panel{background:#fff9eb;border-color:#f0d9a5}.question-panel .pill{background:#ffe6b4;color:#805312}.vocab-panel{background:#f5efff;border-color:#e0cef6}.vocab-panel h3{color:#7143a7}.good{border-left:5px solid #37a167}.bad{border-left:5px solid #e39448}nav button:nth-child(1){color:#246eac}nav button:nth-child(2){color:#c47d24}nav button:nth-child(3){color:#7546b2}nav button:nth-child(4){color:#317b57}button.primary{background:#166554}.section-title{color:#183e57}</style></head><body><header><h1>🇫🇷 Passé composé</h1><p>Theorie · Beispiele · Üben · Direktes Feedback</p></header><div class="wrap" id="app"></div><nav><button onclick="home()">🏠 Themen</button><button onclick="mixed()">🎯 Mix</button><button onclick="vocabHome()">📚 Wörter</button><button onclick="stats()">📈 Fortschritt</button></nav><script>
const lessons=[
{title:"29 · Bildung mit avoir",short:"Hilfsverb + Partizip",theory:"Das passé composé besteht aus dem Präsens von avoir und dem participe passé. Bei avoir bleibt das Partizip normalerweise unverändert.",examples:["J’ai mangé. – Ich habe gegessen.","Nous avons téléphoné. – Wir haben telefoniert.","Ils ont fini. – Sie haben aufgehört."],words:[["manger","mangé"],["parler","parlé"],["finir","fini"],["vendre","vendu"],["dormir","dormi"]]},
{title:"29 · Bildung mit être",short:"Bewegung und Angleichung",theory:"Einige Verben bilden das passé composé mit être. Bei être passt sich das Partizip dem Subjekt an: weiblich +e, Mehrzahl +s, weibliche Mehrzahl +es.",examples:["Elle est allée au cinéma. – Sie ist ins Kino gegangen.","Ils sont restés à la maison. – Sie sind zu Hause geblieben.","Léa et Marie sont sorties. – Léa und Marie sind ausgegangen."],words:[["aller","allé"],["rester","resté"],["partir","parti"],["sortir","sorti"],["arriver","arrivé"]]},
{title:"29 · Verneinung",short:"ne … pas um das Hilfsverb",theory:"Die Verneinung umschliesst das konjugierte Hilfsverb, nicht das Partizip. Bei reflexiven Verben steht ne vor dem Reflexivpronomen.",examples:["Je n’ai pas dormi. – Ich habe nicht geschlafen.","Elle n’est pas restée. – Sie ist nicht geblieben.","Je ne me suis pas reposé(e). – Ich habe mich nicht erholt."],words:[["ne / pas / j’ai / mangé","Je n’ai pas mangé"],["ne / pas / elle est / partie","Elle n’est pas partie"]]},
{title:"30 · Regelmässige Partizipien",short:"-er → -é, -ir → -i, -re → -u",theory:"Regelmässige Verben bilden das Partizip meist so: -er → -é, -ir → -i, -re → -u. Achte auf den Akzent.",examples:["jouer (spielen) → joué (gespielt)","finir (beenden) → fini (beendet)","attendre (warten) → attendu (gewartet)"],words:[["jouer","joué"],["réfléchir","réfléchi"],["attendre","attendu"],["répondre","répondu"],["téléphoner","téléphoné"],["vendre","vendu"]]},
{title:"30 · Unregelmässige Partizipien",short:"Die wichtigen Formen lernen",theory:"Häufige Verben haben ein unregelmässiges Partizip. Diese Formen lernst du am besten durch wiederholtes Üben.",examples:["avoir (haben) → eu (gehabt); être (sein) → été (gewesen); faire (machen) → fait (gemacht)","prendre (nehmen) → pris (genommen); mettre (legen) → mis (gelegt); écrire (schreiben) → écrit (geschrieben)","boire (trinken) → bu (getrunken); lire (lesen) → lu (gelesen); voir (sehen) → vu (gesehen)"],words:[["avoir","eu"],["être","été"],["dire","dit"],["écrire","écrit"],["faire","fait"],["mettre","mis"],["prendre","pris"],["boire","bu"],["croire","cru"],["lire","lu"],["plaire","plu"],["recevoir","reçu"],["venir","venu"],["voir","vu"],["devoir","dû"],["pouvoir","pu"],["vouloir","voulu"],["savoir","su"]]},
{title:"30 · Objekt und Partizip",short:"Stellung und Angleichung",theory:"Bei avoir wird das Partizip normalerweise nicht angeglichen. Steht das direkte Objekt jedoch vor dem Verb, stimmt das Partizip mit diesem Objekt überein.",examples:["Elle a acheté des fleurs. – Sie hat Blumen gekauft.","Quelles fleurs avez-vous achetées ? – Welche Blumen habt ihr gekauft?","Je les ai rencontrés hier. – Ich habe sie gestern getroffen."],words:[["Elle a acheté des fleurs.","Elle a acheté des fleurs."],["Quelles fleurs avez-vous achetées ?","Quelles fleurs avez-vous achetées ?"]]},
{title:"31 · avoir oder être?",short:"Hilfsverb wählen",theory:"Die meisten Verben verwenden avoir – auch marcher, courir, sauter, nager und sogar être. Eine kleine Gruppe von Orts- und Zustandswechselverben nimmt être.",examples:["Nous avons marché six heures. – Wir sind sechs Stunden zu Fuss gegangen.","Elle a été malade. – Sie ist krank gewesen.","Je suis arrivé(e). Nous sommes partis. – Ich bin angekommen. Wir sind weggegangen."],words:[["marcher","avoir"],["courir","avoir"],["être","avoir"],["aller","être"],["venir","être"],["partir","être"],["arriver","être"],["rester","être"],["tomber","être"],["nager","avoir"],["sortir","être"],["mourir","être"]]},
{title:"31 · Reflexive Verben",short:"se reposer → je me suis reposé(e)",theory:"Alle reflexiven Verben bilden das passé composé mit être. Das Reflexivpronomen bleibt vor dem Hilfsverb. Normalerweise passt sich das Partizip dem Subjekt an; bei einigen reflexiven Konstruktionen gelten Ausnahmen.",examples:["Je me suis reposé(e). – Ich habe mich erholt.","Nous nous sommes levés. – Wir sind aufgestanden.","Elle ne s’est pas reposée. – Sie hat sich nicht erholt."],words:[["je / se reposer","Je me suis reposé"],["elle / se reposer","Elle s’est reposée"],["nous / se lever","Nous nous sommes levés"]]}];
const pron=[["je","ai","suis"],["tu","as","es"],["il","a","est"],["elle","a","est"],["nous","avons","sommes"],["vous","avez","êtes"],["ils","ont","sont"],["elles","ont","sont"]];
const norm=s=>s.toLowerCase().normalize("NFC").replace(/[’']/g,"'").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
let questions=[],index=0,answered=false,lesson=-1,chosen=null;
const app=document.getElementById("app"),saved=JSON.parse(localStorage.getItem("pcScores")||"{}");
function home(){let total=Object.values(saved).reduce((a,x)=>a+x.total,0);app.innerHTML='<div class="hero"><div class="eyebrow">Dein Französischtrainer</div><h2>Schritt für Schritt zum passé composé</h2><p>1. Thema auswählen · 2. Erklärung lesen · 3. Üben und sofort erfahren, ob es stimmt.</p></div><div class="section-title">Alle Lernbereiche</div><p class="muted">Tippe auf ein Thema, um die Erklärung und Beispiele zu sehen.</p>'+lessons.map((l,i)=>'<section class="panel chapter-card ch'+(i<3?29:i<6?30:31)+'" onclick="openLesson('+i+')" style="cursor:pointer"><div class="lesson-card"><div class="num">'+(i+1)+'</div><div class="lesson-text"><div class="eyebrow">Kapitel '+(i<3?29:i<6?30:31)+'</div><h3>'+l.title.split(' · ')[1]+'</h3><div class="muted">'+l.short+'</div><div class="smallscore">'+(saved[i]?.total?'✓ '+saved[i].right+' von '+saved[i].total+' Antworten richtig':'Noch nicht geübt')+'</div></div><div class="chev">›</div></div></section>').join('')+'<button class="primary full" onclick="vocabHome()">📚 Alle Wörter übersetzen →</button><div class="tip">💡 Du kannst die Themen in beliebiger Reihenfolge bearbeiten. Unter «Mix» übst du alles zusammen.</div>'}function openLesson(i){lesson=i;let l=lessons[i];app.innerHTML='<button class="back" onclick="home()">← Alle Themen</button><div class="steps"><div class="step active">1 · Verstehen</div><div class="step">2 · Üben</div><div class="step">3 · Rückmeldung</div></div><div class="eyebrow">Lektion '+(i+1)+' von '+lessons.length+'</div><h2>'+l.title.split(' · ')[1]+'</h2><p class="muted">'+l.short+'</p><section class="panel theory-panel"><h3>📖 Einfach erklärt</h3><p>'+l.theory+'</p><h3>💬 Beispiele</h3>'+l.examples.map(e=>'<div class="ex">'+e+'</div>').join('')+'</section><div class="tip">✅ Du hast die Erklärung gelesen? Jetzt kannst du das Thema direkt üben. Nach jeder Antwort wird die Lösung mit Erklärung angezeigt.</div><button class="primary full" onclick="start('+i+')">Jetzt Aufgaben lösen →</button>'}function build(i){let l=lessons[i],q=[];l.words.forEach(([inf,p])=>{if(i===2||i===5||i===7){q.push({q:"Schreibe den französischen Satz korrekt: "+inf,a:p,why:l.theory});return}if(i===6){q.push({q:"Welches Hilfsverb verwendet «"+inf+"»?",a:p,choices:["avoir","être"],why:l.theory});return}q.push({q:"Wie lautet das participe passé von «"+inf+"»?",a:p,why:l.theory});if(i!==1){let pr=pron[q.length%pron.length];let start=pr[0]==="je"?"J'":pr[0].charAt(0).toUpperCase()+pr[0].slice(1)+" ";q.push({q:"Ergänze: "+start+"___ "+p+" (Verb: "+inf+")",a:pr[1],why:"Im passé composé mit avoir: "+pr[1]+" + "+p+"."})}else{let pr=pron[q.length%pron.length],form=pr[2],suffix=pr[0]==="elle"?"e":pr[0]==="ils"?"s":pr[0]==="elles"?"es":"";q.push({q:"Ergänze das Partizip: "+pr[0]+" "+form+" ____ (Verb: "+inf+")",a:p+suffix,why:l.theory})}});return q}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(i){lesson=i;questions=shuffle(build(i));index=0;showQuestion()}

function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function showQuestion(){answered=false;chosen=null;let q=questions[index];if(!q){app.innerHTML='<section class="panel"><h2>🎉 Übung abgeschlossen!</h2><p>Dein Lernfortschritt wurde auf diesem Gerät gespeichert.</p><button class="primary full" onclick="home()">Zur Themenübersicht</button><button class="full" onclick="'+(lesson<0?'mixed()':'start('+lesson+')')+'">Nochmals üben</button></section>';return}app.innerHTML='<button class="back" onclick="'+(lesson<0?'home()':'openLesson('+lesson+')')+'">← Zur Erklärung</button><div class="steps"><div class="step">1 · Verstehen</div><div class="step active">2 · Üben</div><div class="step">3 · Rückmeldung</div></div><div class="eyebrow">'+(lesson<0?'Gemischte Übungen':'Lektion '+(lesson+1))+'</div><h2>Aufgabe '+(index+1)+' von '+questions.length+'</h2><div class="progress"><span style="width:'+((index)/questions.length*100)+'%"></span></div><section class="panel question-panel"><div class="pill">'+(q.choices?'Wähle die richtige Antwort':'Schreibe deine Antwort')+'</div><p class="question">'+esc(q.q)+'</p>'+(q.choices?'<div class="answers">'+q.choices.map((c,j)=>'<button id="o'+j+'" onclick="choose('+j+')">'+esc(c)+'</button>').join('')+'</div>':'<input id="answer" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Hier Antwort eingeben" onkeydown="if(event.key===\'Enter\')check()"><p class="muted">Achte auf die französische Schreibweise und die Akzente.</p>')+'<div id="feedback" aria-live="polite"></div><button id="check" class="primary full" onclick="check()">Antwort prüfen ✓</button><button id="next" class="primary full" style="display:none" onclick="index++;showQuestion()">Nächste Aufgabe →</button></section>'}function choose(j){if(answered)return;chosen=j;document.querySelectorAll('.answers button').forEach((b,k)=>b.classList.toggle('selected',k===j))}
function check(){if(answered)return;let q=questions[index],v=q.choices? q.choices[chosen]:(document.getElementById('answer')?.value||'');if(!v)return;answered=true;let ok=norm(v)===norm(q.a);document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'✅ Richtig beantwortet!':'💡 Das kannst du dir merken:')+'</strong><p>Richtige Lösung: <strong>'+esc(q.a)+'</strong></p><p>'+esc(q.why)+'</p></div>';document.getElementById('check').style.display='none';document.getElementById('next').style.display='inline-block';const s=lesson>=0?lesson:q.topic;saved[s] ||= {right:0,total:0};saved[s].total++;if(ok)saved[s].right++;localStorage.setItem("pcScores",JSON.stringify(saved))}
function stats(){app.innerHTML='<h2>Dein Lernfortschritt</h2>'+lessons.map((l,i)=>{let x=saved[i]||{right:0,total:0};return '<section class="panel"><strong>'+l.title+'</strong><p>'+x.right+' / '+x.total+' korrekt'+(x.total?' · '+Math.round(x.right/x.total*100)+' %':'')+'</p><div class="progress"><span style="width:'+(x.total?x.right/x.total*100:0)+'%"></span></div></section>'}).join('')+'<button onclick="if(confirm(\'Fortschritt wirklich löschen?\')){localStorage.removeItem(\'pcScores\');location.reload()}">Fortschritt zurücksetzen</button>'}
