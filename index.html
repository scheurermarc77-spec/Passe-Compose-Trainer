<!doctype html><html lang="de-CH"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#125f52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Passé composé"><link rel="manifest" href="manifest.webmanifest"><title>Passé composé Trainer</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#172a29;background:#f5f7f6}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(135deg,#116958,#16443f);color:white;padding:22px 21px 25px;border-radius:0 0 26px 26px}header h1{margin:0;font-size:27px;letter-spacing:-.6px}header p{margin:7px 0 0;color:#def7ec;font-size:14px}.wrap{max-width:740px;margin:auto;padding:19px 16px 105px}h2{font-size:23px;letter-spacing:-.3px;margin:20px 0 9px}h3{font-size:18px;color:#155c4f;margin:0 0 10px}.panel{background:white;padding:19px;border:1px solid #dce8e2;border-radius:19px;margin:12px 0;box-shadow:0 3px 14px #0e45310b}p{line-height:1.55}button{font:inherit;border:0;border-radius:12px;padding:13px 15px;cursor:pointer;background:#e7f1eb;color:#125f52;font-weight:750;margin:4px 4px 4px 0;min-height:46px}button.primary{color:white;background:#126450}button:disabled{opacity:.55}.muted{color:#617470;font-size:14px}.eyebrow{color:#116958;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}.steps{display:flex;gap:7px;align-items:center;margin:12px 0 19px}.step{flex:1;text-align:center;border-radius:9px;padding:8px 5px;background:#e5eee9;font-size:12px;font-weight:700;color:#526c64}.step.active{background:#146451;color:white}.lesson-card{display:flex;gap:14px;align-items:center}.num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#d9eee3;color:#12604e;font-size:19px;font-weight:800;flex-shrink:0}.lesson-text{flex:1;min-width:0}.lesson-text h3{margin:2px 0 4px}.lesson-card .chev{font-size:26px;color:#43806f}.ex{background:#eef7f1;border-left:4px solid #28876c;padding:13px;border-radius:10px;margin:10px 0;line-height:1.5}.question{font-size:21px;font-weight:750;line-height:1.45}.answers{display:grid;gap:9px}.answers button{text-align:left;margin:0;background:#f3f6f4;border:2px solid #e0e9e3}.answers button.selected{border-color:#14765b;background:#e6f5ea}input{width:100%;font-size:18px;padding:15px;border-radius:12px;border:2px solid #c5d9ce;margin:8px 0}input:focus{outline:2px solid #197558}.feedback{border-radius:13px;padding:15px;margin:14px 0;line-height:1.5}.good{background:#def4e5;color:#145a36}.bad{background:#fff0e4;color:#824015}nav{position:fixed;bottom:0;background:#fff;left:0;right:0;border-top:1px solid #dce4df;display:flex;justify-content:space-around;padding:5px 0 max(env(safe-area-inset-bottom),7px);box-shadow:0 -4px 18px #152b2410}nav button{padding:9px 7px;font-size:12px;background:transparent;min-height:51px;flex:1;margin:0}.progress{height:10px;background:#dce9e3;border-radius:12px;overflow:hidden}.progress span{height:100%;display:block;background:#138362}.hero{background:#e2f2e9;border-radius:20px;padding:19px;margin:9px 0 19px}.hero p{margin:8px 0}.hero button{width:100%;margin:8px 0 0}.section-title{font-size:17px;font-weight:800;margin:22px 0 6px}.pill{font-size:12px;color:#2f6759;background:#e9f2ed;padding:5px 9px;border-radius:20px;display:inline-block}.tip{color:#50645e;background:#f2f6f3;border-radius:12px;padding:12px;font-size:14px}.full{width:100%;margin:7px 0}.back{background:transparent;padding:8px 0}.smallscore{font-size:12px;color:#647873}.hide{display:none}</style></head><body><header><h1>🇫🇷 Passé composé</h1><p>Theorie · Beispiele · Üben · Direktes Feedback</p></header><div class="wrap" id="app"></div><nav><button onclick="home()">🏠 Themen</button><button onclick="mixed()">🎯 Mix</button><button onclick="stats()">📈 Fortschritt</button></nav><script>
const lessons=[
{title:"29 · Bildung mit avoir",short:"Hilfsverb + Partizip",theory:"Das passé composé besteht aus dem Präsens von avoir und dem participe passé. Bei avoir bleibt das Partizip normalerweise unverändert.",examples:["J’ai mangé. – Ich habe gegessen.","Nous avons téléphoné. – Wir haben telefoniert.","Ils ont fini. – Sie haben beendet."],words:[["manger","mangé"],["parler","parlé"],["finir","fini"],["vendre","vendu"],["dormir","dormi"]]},
{title:"29 · Bildung mit être",short:"Bewegung und Angleichung",theory:"Einige Verben bilden das passé composé mit être. Bei être passt sich das Partizip dem Subjekt an: weiblich +e, Mehrzahl +s, weibliche Mehrzahl +es.",examples:["Elle est allée au cinéma.","Ils sont restés à la maison.","Léa et Marie sont sorties."],words:[["aller","allé"],["rester","resté"],["partir","parti"],["sortir","sorti"],["arriver","arrivé"]]},
{title:"29 · Verneinung",short:"ne … pas um das Hilfsverb",theory:"Die Verneinung umschliesst das konjugierte Hilfsverb, nicht das Partizip. Bei reflexiven Verben steht ne vor dem Reflexivpronomen.",examples:["Je n’ai pas dormi.","Elle n’est pas restée.","Je ne me suis pas reposé(e)."],words:[["ne / pas / j’ai / mangé","Je n’ai pas mangé"],["ne / pas / elle est / partie","Elle n’est pas partie"]]},
{title:"30 · Regelmässige Partizipien",short:"-er → -é, -ir → -i, -re → -u",theory:"Regelmässige Verben bilden das Partizip meist so: -er → -é, -ir → -i, -re → -u. Achte auf den Akzent.",examples:["jouer → joué","finir → fini","attendre → attendu"],words:[["jouer","joué"],["réfléchir","réfléchi"],["attendre","attendu"],["répondre","répondu"],["téléphoner","téléphoné"],["vendre","vendu"]]},
{title:"30 · Unregelmässige Partizipien",short:"Die wichtigen Formen lernen",theory:"Häufige Verben haben ein unregelmässiges Partizip. Diese Formen lernst du am besten durch wiederholtes Üben.",examples:["avoir → eu; être → été; faire → fait","prendre → pris; mettre → mis; écrire → écrit","boire → bu; lire → lu; voir → vu"],words:[["avoir","eu"],["être","été"],["dire","dit"],["écrire","écrit"],["faire","fait"],["mettre","mis"],["prendre","pris"],["boire","bu"],["croire","cru"],["lire","lu"],["plaire","plu"],["recevoir","reçu"],["venir","venu"],["voir","vu"],["devoir","dû"],["pouvoir","pu"],["vouloir","voulu"],["savoir","su"]]},
{title:"30 · Objekt und Partizip",short:"Stellung und Angleichung",theory:"Bei avoir wird das Partizip normalerweise nicht angeglichen. Steht das direkte Objekt jedoch vor dem Verb, stimmt das Partizip mit diesem Objekt überein.",examples:["Elle a acheté des fleurs.","Quelles fleurs avez-vous achetées ?","Je les ai rencontrés hier."],words:[["Elle a acheté des fleurs.","Elle a acheté des fleurs."],["Quelles fleurs avez-vous achetées ?","Quelles fleurs avez-vous achetées ?"]]},
{title:"31 · avoir oder être?",short:"Hilfsverb wählen",theory:"Die meisten Verben verwenden avoir – auch marcher, courir, sauter, nager und sogar être. Eine kleine Gruppe von Orts- und Zustandswechselverben nimmt être.",examples:["Nous avons marché six heures.","Elle a été malade.","Je suis arrivé(e). Nous sommes partis."],words:[["marcher","avoir"],["courir","avoir"],["être","avoir"],["aller","être"],["venir","être"],["partir","être"],["arriver","être"],["rester","être"],["tomber","être"],["nager","avoir"],["sortir","être"],["mourir","être"]]},
{title:"31 · Reflexive Verben",short:"se reposer → je me suis reposé(e)",theory:"Alle reflexiven Verben bilden das passé composé mit être. Das Reflexivpronomen bleibt vor dem Hilfsverb. Normalerweise passt sich das Partizip dem Subjekt an; bei einigen reflexiven Konstruktionen gelten Ausnahmen.",examples:["Je me suis reposé(e).","Nous nous sommes levés.","Elle ne s’est pas reposée."],words:[["je / se reposer","Je me suis reposé"],["elle / se reposer","Elle s’est reposée"],["nous / se lever","Nous nous sommes levés"]]}];
const pron=[["je","ai","suis"],["tu","as","es"],["il","a","est"],["elle","a","est"],["nous","avons","sommes"],["vous","avez","êtes"],["ils","ont","sont"],["elles","ont","sont"]];
const norm=s=>s.toLowerCase().normalize("NFC").replace(/[’']/g,"'").replace(/[.!?]/g,"").replace(/\s+/g," ").trim();
let questions=[],index=0,answered=false,lesson=-1,chosen=null;
const app=document.getElementById("app"),saved=JSON.parse(localStorage.getItem("pcScores")||"{}");
function home(){let total=Object.values(saved).reduce((a,x)=>a+x.total,0);app.innerHTML='<div class="hero"><div class="eyebrow">Dein Französischtrainer</div><h2>Schritt für Schritt zum passé composé</h2><p>1. Thema auswählen · 2. Erklärung lesen · 3. Üben und sofort erfahren, ob es stimmt.</p><button class="primary" onclick="openLesson(0)">🚀 Mit Kapitel 29 starten</button></div><div class="section-title">Alle Lernbereiche</div><p class="muted">Tippe auf ein Thema, um die Erklärung und Beispiele zu sehen.</p>'+lessons.map((l,i)=>'<section class="panel" onclick="openLesson('+i+')" style="cursor:pointer"><div class="lesson-card"><div class="num">'+(i+1)+'</div><div class="lesson-text"><div class="eyebrow">Kapitel '+(i<3?29:i<6?30:31)+'</div><h3>'+l.title.split(' · ')[1]+'</h3><div class="muted">'+l.short+'</div><div class="smallscore">'+(saved[i]?.total?'✓ '+saved[i].right+' von '+saved[i].total+' Antworten richtig':'Noch nicht geübt')+'</div></div><div class="chev">›</div></div></section>').join('')+'<div class="tip">💡 Du kannst die Themen in beliebiger Reihenfolge bearbeiten. Unter «Mix» übst du alles zusammen.</div>'}function openLesson(i){lesson=i;let l=lessons[i];app.innerHTML='<button class="back" onclick="home()">← Alle Themen</button><div class="steps"><div class="step active">1 · Verstehen</div><div class="step">2 · Üben</div><div class="step">3 · Rückmeldung</div></div><div class="eyebrow">Lektion '+(i+1)+' von '+lessons.length+'</div><h2>'+l.title.split(' · ')[1]+'</h2><p class="muted">'+l.short+'</p><section class="panel"><h3>📖 Einfach erklärt</h3><p>'+l.theory+'</p><h3>💬 Beispiele</h3>'+l.examples.map(e=>'<div class="ex">'+e+'</div>').join('')+'</section><div class="tip">✅ Du hast die Erklärung gelesen? Jetzt kannst du das Thema direkt üben. Nach jeder Antwort wird die Lösung erklärt.</div><button class="primary full" onclick="start('+i+')">Jetzt Aufgaben lösen →</button>'}function build(i){let l=lessons[i],q=[];l.words.forEach(([inf,p])=>{if(i===2||i===5||i===7){q.push({q:"Schreibe den französischen Satz korrekt: "+inf,a:p,why:l.theory});return}if(i===6){q.push({q:"Welches Hilfsverb verwendet «"+inf+"»?",a:p,choices:["avoir","être"],why:l.theory});return}q.push({q:"Wie lautet das participe passé von «"+inf+"»?",a:p,why:l.theory});if(i!==1){let pr=pron[q.length%pron.length];let start=pr[0]==="je"?"J'":pr[0].charAt(0).toUpperCase()+pr[0].slice(1)+" ";q.push({q:"Ergänze: "+start+"___ "+p+" (Verb: "+inf+")",a:pr[1],why:"Im passé composé mit avoir: "+pr[1]+" + "+p+"."})}else{let pr=pron[q.length%pron.length],form=pr[2],suffix=pr[0]==="elle"?"e":pr[0]==="ils"?"s":pr[0]==="elles"?"es":"";q.push({q:"Ergänze das Partizip: "+pr[0]+" "+form+" ____ (Verb: "+inf+")",a:p+suffix,why:l.theory})}});return q}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function start(i){lesson=i;questions=shuffle(build(i));index=0;showQuestion()}
function mixed(){lesson=-1;questions=shuffle(lessons.flatMap((l,i)=>build(i).map(q=>({...q,topic:i}))));index=0;showQuestion()}
function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;")}
function showQuestion(){answered=false;chosen=null;let q=questions[index];if(!q){app.innerHTML='<section class="panel"><h2>🎉 Übung abgeschlossen!</h2><p>Dein Lernfortschritt wurde auf diesem Gerät gespeichert.</p><button class="primary full" onclick="home()">Zur Themenübersicht</button><button class="full" onclick="'+(lesson<0?'mixed()':'start('+lesson+')')+'">Nochmals üben</button></section>';return}app.innerHTML='<button class="back" onclick="'+(lesson<0?'home()':'openLesson('+lesson+')')+'">← Zur Erklärung</button><div class="steps"><div class="step">1 · Verstehen</div><div class="step active">2 · Üben</div><div class="step">3 · Rückmeldung</div></div><div class="eyebrow">'+(lesson<0?'Gemischte Übungen':'Lektion '+(lesson+1))+'</div><h2>Aufgabe '+(index+1)+' von '+questions.length+'</h2><div class="progress"><span style="width:'+((index)/questions.length*100)+'%"></span></div><section class="panel"><div class="pill">'+(q.choices?'Wähle die richtige Antwort':'Schreibe deine Antwort')+'</div><p class="question">'+esc(q.q)+'</p>'+(q.choices?'<div class="answers">'+q.choices.map((c,j)=>'<button id="o'+j+'" onclick="choose('+j+')">'+esc(c)+'</button>').join('')+'</div>':'<input id="answer" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Hier Antwort eingeben" onkeydown="if(event.key===\'Enter\')check()"><p class="muted">Achte auf die französische Schreibweise und die Akzente.</p>')+'<div id="feedback" aria-live="polite"></div><button id="check" class="primary full" onclick="check()">Antwort prüfen ✓</button><button id="next" class="primary full" style="display:none" onclick="index++;showQuestion()">Nächste Aufgabe →</button></section>'}function choose(j){if(answered)return;chosen=j;document.querySelectorAll('.answers button').forEach((b,k)=>b.classList.toggle('selected',k===j))}
function check(){if(answered)return;let q=questions[index],v=q.choices? q.choices[chosen]:(document.getElementById('answer')?.value||'');if(!v)return;answered=true;let ok=norm(v)===norm(q.a);document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><strong>'+(ok?'✅ Richtig beantwortet!':'💡 Das kannst du dir merken:')+'</strong><p>Richtige Lösung: <strong>'+esc(q.a)+'</strong></p><p>'+esc(q.why)+'</p></div>';document.getElementById('check').style.display='none';document.getElementById('next').style.display='inline-block';const s=lesson>=0?lesson:q.topic;saved[s] ||= {right:0,total:0};saved[s].total++;if(ok)saved[s].right++;localStorage.setItem("pcScores",JSON.stringify(saved))}
function stats(){app.innerHTML='<h2>Dein Lernfortschritt</h2>'+lessons.map((l,i)=>{let x=saved[i]||{right:0,total:0};return '<section class="panel"><strong>'+l.title+'</strong><p>'+x.right+' / '+x.total+' korrekt'+(x.total?' · '+Math.round(x.right/x.total*100)+' %':'')+'</p><div class="progress"><span style="width:'+(x.total?x.right/x.total*100:0)+'%"></span></div></section>'}).join('')+'<button onclick="if(confirm(\'Fortschritt wirklich löschen?\')){localStorage.removeItem(\'pcScores\');location.reload()}">Fortschritt zurücksetzen</button>'}
home();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
